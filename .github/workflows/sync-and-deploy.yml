
name: Sync VIcons and Deploy API

on:
  repository_dispatch:
    types: [vicons-updated]

  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: vicons-api-sync-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize icon catalog
        run: npm run sync:icons

      - name: Run tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/icon-paths.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: sync VIcons catalog"
            git push
          else
            echo "Icon catalog already up to date."
          fi

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify deployment
        run: |
          curl --fail --show-error \
            --retry 3 --retry-delay 3 \
            https://vicons-svg-api.veasnawt.workers.dev/health
